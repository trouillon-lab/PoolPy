[theme]
base = "light"
primaryColor = "#35659C"
backgroundColor = "#FBF9F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#16202B"
font = "sans serif"

[server]
maxUploadSize = 20

[browser]
gatherUsageStats = false

[client]
# Hides the three-dot menu (Print, Rerun, Streamlit version). Kept in step with
# the streamlitConfig block in index.html, which stlite uses instead of this file.
toolbarMode = "minimal"
